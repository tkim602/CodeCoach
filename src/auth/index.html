<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>코딩코치 — 계정</title>
    <link rel="stylesheet" href="./auth.css">
  </head>
  <body>
    <div class="auth-shell">
      <header class="auth-header">
        <span class="auth-brand">코딩코치</span>
      </header>

      <!-- Sign-up view -->
      <main id="view-signup" class="auth-card" hidden>
        <h1>회원가입</h1>
        <p class="auth-desc">이미 계정이 있으신가요? 사이드 패널에서 로그인 하기 를 눌러 로그인하세요.</p>

        <form id="signup-form" class="auth-form" novalidate>
          <label class="auth-field">
            <span>이름 (선택)</span>
            <input id="signup-name" type="text" autocomplete="name" placeholder="홍길동">
          </label>
          <label class="auth-field">
            <span>이메일 *</span>
            <input id="signup-email" type="email" autocomplete="email" placeholder="user@example.com" required>
          </label>
          <label class="auth-field">
            <span>비밀번호 *</span>
            <input id="signup-password" type="password" autocomplete="new-password" placeholder="대문자와 특수문자 포함" required>
          </label>
          <label class="auth-field">
            <span>비밀번호 확인 *</span>
            <input id="signup-confirm" type="password" autocomplete="new-password" placeholder="비밀번호 재입력" required>
          </label>
          <p class="auth-desc auth-password-rule">비밀번호는 6자 이상, 영어 대문자 1개 이상, 특수문자 1개 이상을 포함해야 합니다.</p>
          <div id="signup-error" class="auth-error" hidden></div>
          <button id="signup-submit" class="auth-btn primary" type="submit">가입하기</button>
        </form>
      </main>

      <!-- Password reset view -->
      <main id="view-reset" class="auth-card" hidden>
        <h1>비밀번호 찾기</h1>
        <p class="auth-desc">가입한 이메일 주소를 입력하면 재설정 링크를 보내드립니다.</p>

        <form id="reset-form" class="auth-form" novalidate>
          <label class="auth-field">
            <span>이메일 *</span>
            <input id="reset-email" type="email" autocomplete="email" placeholder="user@example.com" required>
          </label>
          <div id="reset-error" class="auth-error" hidden></div>
          <button id="reset-submit" class="auth-btn primary" type="submit">재설정 링크 보내기</button>
        </form>
      </main>

      <!-- Success view -->
      <main id="view-success" class="auth-card auth-card--success" hidden>
        <svg class="auth-success-icon" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <path d="M14 24l8 8 14-14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 id="success-title">완료</h1>
        <p id="success-message" class="auth-desc"></p>
        <button id="success-close" class="auth-btn" type="button">이 탭 닫기</button>
      </main>
    </div>

    <script type="module" src="./auth.js"></script>
  </body>
</html>
